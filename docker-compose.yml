services:
  notes-to-action:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOCAL_DB_PATH=/app/data/notes-to-action-db
      # - OPENAI_API_KEY=your_openai_key_here
    volumes:
      - notes_data:/app/data
    restart: unless-stopped

volumes:
  notes_data:
